name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - pyproject.toml
      - create3d/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - pyproject.toml
      - create3d/**
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # push to ghcr.io with GITHUB_TOKEN

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full          # shape + texture  -> :latest, :sha-xxxxxxx, :v1.2.3
            with_texture: "1"
            suffix: ""
          - variant: shape         # shape only, no CUDA compile -> :shape, :sha-xxxxxxx-shape, ...
            with_texture: "0"
            suffix: "-shape"

    steps:
      - name: Free disk space
        # The image is ~15 GB (CUDA devel + PyTorch); hosted runners start with ~14 GB free.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && matrix.variant == 'full' }}
            type=raw,value=shape,enable=${{ github.ref == 'refs/heads/main' && matrix.variant == 'shape' }},suffix=
            type=sha
            type=semver,pattern={{version}}
            type=ref,event=pr

      - name: Build
        # No setup-buildx step: the default "docker" driver puts the image straight into
        # the local image store, so the test step can run it without an export/load.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: WITH_TEXTURE=${{ matrix.with_texture }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test (no GPU on the runner)
        run: |
          img=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run --rm --entrypoint pip "$img" show create3d
          docker run --rm "$img" --help
          docker run --rm --entrypoint python "$img" -c "
          import importlib.util as u
          import torch, hy3dgen.shapegen, hy3dgen.rembg, create3d.engine, create3d.app
          print('torch', torch.__version__, 'cuda', torch.version.cuda)
          if '${{ matrix.with_texture }}' == '1':
              for m in ('custom_rasterizer', 'custom_rasterizer_kernel', 'mesh_processor'):
                  assert u.find_spec(m), m + ' not installed'
              print('texture extensions installed')
          "
          docker run --rm --entrypoint assimp "$img" version | head -n1

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done
