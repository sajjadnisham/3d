[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "create3d"
version = "0.1.0"
description = "Create 3D models from images or text with Tencent Hunyuan3D-2"
readme = "README.md"
requires-python = ">=3.10"
# Pinned versions of everything (incl. hy3dgen from GitHub) live in requirements.txt.
dependencies = ["pillow", "trimesh", "gradio"]

[project.scripts]
create3d = "create3d.cli:main"

[tool.setuptools]
packages = ["create3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: runs the real Hunyuan3D-2 code (needs the full requirements.txt)"]

[tool.ruff]
line-length = 120
# The Colab notebook puts imports after its form fields on purpose; tests/test_repo.py
# checks that its cells compile instead.
extend-exclude = ["*.ipynb"]
